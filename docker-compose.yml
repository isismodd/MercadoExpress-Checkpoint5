# RabbitMQ local com o painel de gerenciamento (Dashboard)
#   docker compose up -d
#   Dashboard: http://localhost:15672  (usuário: guest / senha: guest)
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-mercado
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
