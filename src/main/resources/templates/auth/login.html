<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mercado Express</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white text-center">
                    <h3 class="mb-0">Mercado Express</h3>
                    <small>Acesse sua conta</small>
                </div>
                <div class="card-body">
                    <div th:if="${param.error}" class="alert alert-danger">Usuário ou senha inválidos!</div>
                    <div th:if="${param.logout}" class="alert alert-info">Você saiu do sistema.</div>
                    <div th:if="${param.cadastrado}" class="alert alert-success">Cadastro realizado! Faça login.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Entrar</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">Não tem conta? <a href="/cadastro">Cadastre-se</a></p>
                    <p class="text-center mb-0"><a href="/">Voltar ao início</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
