<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Mercado Express</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0">Criar conta</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/cadastro}" th:object="${cadastro}" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control">
                            <div class="text-danger small" th:errors="*{nome}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuário</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control">
                            <div class="text-danger small" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" th:field="*{senha}" class="form-control">
                            <div class="text-danger small" th:errors="*{senha}"></div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">Já tem conta? <a href="/login">Entrar</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
