<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::page})}">
<head>
    <title>Usuários</title>
</head>
<body>
<div th:fragment="page">
    <h1>Usuários cadastrados <span class="badge bg-danger fs-6">Área ADMIN</span></h1>
    <table class="table table-striped mt-3">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nome</th><th>Usuário</th><th>Perfil</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nome}"></td>
            <td th:text="${u.username}"></td>
            <td><span class="badge" th:classappend="${u.perfil == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'" th:text="${u.perfil}"></span></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
