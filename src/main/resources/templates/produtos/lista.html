<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::page})}">
<head>
    <title>Lista de Produtos</title>
</head>
<body>
<div th:fragment="page">
    <h1>Produtos</h1>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <div class="d-flex flex-wrap gap-2 mb-3">
        <form th:action="@{/web/produtos}" method="get" class="d-flex gap-2">
            <input type="text" name="busca" th:value="${busca}" class="form-control" placeholder="Buscar por nome...">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
            <a th:href="@{/web/produtos}" class="btn btn-outline-secondary">Limpar</a>
        </form>
        <a th:if="${isAdmin}" href="/web/produtos/novo" class="btn btn-outline-success ms-auto">Novo Produto</a>
    </div>

    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th><th>Nome</th><th>Tipo</th><th>Setor</th><th>Preço</th><th>Estoque</th><th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.tipo}"></td>
            <td th:text="${p.setor}"></td>
            <td th:text="'R$ ' + ${p.preco}"></td>
            <td th:text="${p.estoque} ?: 0"></td>
            <td>
                <a th:href="@{/web/produtos/{id}(id=${p.id})}" class="btn btn-outline-secondary btn-sm" title="Ver">
                    <i class="fa-regular fa-eye"></i>
                </a>
                <a th:if="${isAdmin}" th:href="@{/web/produtos/{id}/editar(id=${p.id})}" class="btn btn-outline-warning btn-sm" title="Editar">
                    <i class="fa-regular fa-pen-to-square"></i>
                </a>
                <form th:if="${isAdmin}" th:action="@{/web/produtos/{id}/delete(id=${p.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Deletar" onclick="return confirm('Deletar?')">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(produtos)}"><td colspan="7" class="text-center">Nenhum produto encontrado.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
