<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::page})}">
<head>
    <title>Detalhes do Produto</title>
</head>
<body>
<div th:fragment="page">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Detalhes do Produto</h1>
        <a href="/web/produtos" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i> Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">ID:</dt>
                <dd class="col-sm-9" th:text="${produto.id}">1</dd>

                <dt class="col-sm-3">Nome:</dt>
                <dd class="col-sm-9" th:text="${produto.nome}">Produto</dd>

                <dt class="col-sm-3">Tipo:</dt>
                <dd class="col-sm-9" th:text="${produto.tipo}">Eletrônico</dd>

                <dt class="col-sm-3">Setor:</dt>
                <dd class="col-sm-9" th:text="${produto.setor}">Perfumaria</dd>

                <dt class="col-sm-3">Tamanho:</dt>
                <dd class="col-sm-9" th:text="${produto.tamanho}">M</dd>

                <dt class="col-sm-3">Preço:</dt>
                <dd class="col-sm-9" th:text="'R$ ' + ${produto.preco}">R$ 10.00</dd>

                <dt class="col-sm-3" th:if="${isAdmin}">Custo:</dt>
                <dd class="col-sm-9" th:if="${isAdmin}" th:text="'R$ ' + ${produto.custo}">R$ 5.00</dd>

                <dt class="col-sm-3">Estoque:</dt>
                <dd class="col-sm-9" th:text="${produto.estoque} ?: 0">0</dd>
            </dl>

            <div class="d-flex gap-2 mt-3">
                <a th:if="${isAdmin}" th:href="@{/web/produtos/{id}/editar(id=${produto.id})}" class="btn btn-outline-warning">
                    <i class="fas fa-edit me-2"></i> Editar
                </a>
                <form th:if="${isAdmin}" th:action="@{/web/produtos/{id}/delete(id=${produto.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Deletar?')">
                        <i class="fas fa-trash me-2"></i> Deletar
                    </button>
                </form>
                <a href="/web/produtos" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left me-2"></i> Voltar
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
