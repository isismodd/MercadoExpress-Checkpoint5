<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Cadastrar Produto</h1>
        <a href="/web/produtos" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-2"></i> Voltar
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/web/produtos}" th:object="${produto}" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <input type="text" id="tipo" th:field="*{tipo}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="setor" class="form-label">Setor</label>
                    <input type="text" id="setor" th:field="*{setor}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="tamanho" class="form-label">Tamanho</label>
                    <input type="text" id="tamanho" th:field="*{tamanho}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço *</label>
                    <input type="number" step="0.01" id="preco" th:field="*{preco}" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="custo" class="form-label">Custo</label>
                        <input type="number" step="0.01" min="0" id="custo" th:field="*{custo}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="estoque" class="form-label">Estoque</label>
                        <input type="number" min="0" id="estoque" th:field="*{estoque}" class="form-control">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-2"></i> Salvar
                    </button>
                    <a href="/web/produtos" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-2"></i> Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
